server:
    rundir: "/rundir"
    listen: 127.0.0.1@15353
    udp-workers: 4
    tcp-workers: 1
    background-workers: 1

log:
  - target: stderr
    any: notice

database:
    storage: "/storage"

template:
  - id: default
    storage: "/config"
    journal-content: none
    zonefile-sync: -1

zone:
  - domain: test
    file: test.zone
